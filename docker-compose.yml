version: "3.9"

services:

  postgres:
    build: ./database
    container_name: ims_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/initdb.sql
    networks:
      - ims_network

  backend:
    build: ./backend
    container_name: ims_backend
    restart: always
    networks:
      - ims_network
    depends_on:
      - postgres
    environment:
      FLASK_ENV: development
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "True"
      DATABASE_URL: postgresql://postgres:1234@db:5432/inventory_management_db
      TEST_DATABASE_URL: postgresql://postgres:1234@db:5432/inventory_db_test
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: ims_frontend
    restart: always
    depends_on: 
      - backend
    ports:
      - "5173:5173"
    networks:
      - ims_network

  nginx:
    build: ./nginx
    container_name: ims_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ims_network

networks:
  ims_network:
    driver: bridge

volumes:
  db_data:



