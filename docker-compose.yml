# ================================================
# Inventory Management System — Docker Compose
# Services: postgres | backend (Flask) | frontend (React/Nginx)
# ================================================

services:

  # ── PostgreSQL Database ─────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_management_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask Backend ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: ims_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD:-1234}@postgres:5432/${POSTGRES_DB:-inventory_management_db}
    volumes:
      - ./backend:/app     # Remove this line in production for immutable image
    command: >
      sh -c "flask db upgrade && 
      python seed_data.py || true && 
      python run.py"

  # ── React Frontend (Nginx) ──────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000/api/v1}
    container_name: ims_frontend
    restart: unless-stopped
    depends_on:
      - backend
      
volumes:
  postgres_data:
    driver: local