# ================================================
# docker-compose.yml — Inventory Management Stack
# ================================================
# Services:
#   db       → PostgreSQL 16
#   backend  → Flask API (gunicorn, multi-stage Alpine)
#   frontend → React (Nginx, multi-stage Alpine)
#
# Network:
#   inventory_network (bridge) — all services communicate
#   using their service names as hostnames (Docker DNS).
#
# Usage:
#   docker compose up --build          # Build & start all
#   docker compose up --build -d       # Same, detached
#   docker compose logs -f             # Tail all logs
#   docker compose down -v             # Stop & remove volumes
# ================================================

services:

  # ============================================================
  # SERVICE 1: PostgreSQL Database
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: inventory_db
    restart: unless-stopped

    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}

    volumes:
      # Named volume — persists data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: place .sql init scripts here to auto-run on first start
      # - ./db/init:/docker-entrypoint-initdb.d

    ports:
      # Exposes PostgreSQL to the HOST machine (e.g., DBeaver, pgAdmin)
      # Remove or comment out in production to avoid exposing the DB publicly
      - "${DB_PORT:-5432}:5432"

    networks:
      - inventory_network

    healthcheck:
      # pg_isready polls until the DB accepts connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # SERVICE 2: Flask Backend API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: unless-stopped

    # Load ALL backend environment variables from the root .env file
    env_file:
      - .env

    # Extra env overrides (these take precedence over env_file)
    environment:
      # IMPORTANT: Use "db" (Docker service name) — NOT localhost
      DATABASE_URL:      postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      FLASK_ENV:         ${FLASK_ENV:-development}
      FLASK_HOST:        "0.0.0.0"
      FLASK_PORT:        "5000"
      SECRET_KEY:        ${SECRET_KEY}
      JWT_SECRET:        ${JWT_SECRET}

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    networks:
      - inventory_network

    # ---- Wait for the database to be healthy before starting ----
    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      # FIX: Alpine does NOT have curl — use wget (built-in to Alpine)
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ---- Development volume mount (optional) ----
    # Uncomment to enable hot-reload during development.
    # Note: Add --reload to gunicorn CMD for hot-reload to work.
    # volumes:
    #   - ./backend:/app

  # ============================================================
  # SERVICE 3: React Frontend (Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Nginx proxies /api/* → backend, so the browser-side URL
        # is just the current page host + /api/v1 (same-origin — no CORS)
        REACT_APP_API_BASE_URL: http://localhost/api/v1
    container_name: inventory_frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - inventory_network

    # Frontend must wait for the backend to be healthy
    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    # Named volume managed by Docker — survives container restarts
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  inventory_network:
    name: inventory_network
    driver: bridge
    # All three containers join this network.
    # Docker automatically adds DNS entries so:
    #   "db"       resolves inside backend container
    #   "backend"  resolves inside frontend's Nginx config
