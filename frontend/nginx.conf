# ================================================
# Nginx Config — Inventory Management Frontend
# ================================================
# Responsibilities:
#   1. Serve React's static build at /
#   2. Handle React Router (SPA) — all unknown paths → index.html
#   3. Proxy API requests (/api/*) → Flask backend container
# ================================================

server {
    listen 80;
    server_name localhost;

    # Root for React static files
    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---- API Proxy to Flask backend ----
    # All requests starting with /api/ are forwarded to the backend container.
    # "backend" resolves via Docker's internal DNS on inventory_network.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS preflight pass-through
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 204;
        }
    }

    # ---- React SPA fallback ----
    # For any route React Router handles (e.g. /dashboard, /products),
    # return index.html so the client-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static asset caching ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Security headers ----
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
}
